services:
  - type: web
    name: growfinix-tour-enquiry-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_NAME
        value: "System Administrator"
      - key: ADMIN_EMAIL
        value: "admin@wanderflow.com"
      - key: ADMIN_PASSWORD
        sync: false
